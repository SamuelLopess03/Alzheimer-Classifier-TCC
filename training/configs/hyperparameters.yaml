# ============================================================
# CONFIGURAÇÕES DE ARQUITETURAS E HIPERPARÂMETROS
# ============================================================

# ------------------------------------------------------------
# 1. ARQUITETURAS SUPORTADAS
# ------------------------------------------------------------
supported_architectures:
  cnn:
    - resnext50_32x4d
    - convnext_tiny
    - efficientnetv2_s
    - densenet121
  transformer:
    - vit_b_16
    - swin_v2_tiny

# ------------------------------------------------------------
# 2. ADAPTAÇÃO PARA IMAGEM MÉDICA (GRAYSCALE)
# ------------------------------------------------------------
grayscale_adaptation:
  enabled: true
  preserve_pretrained_weights: true
  expected_channels: 1

# ------------------------------------------------------------
# 3. CONFIGURAÇÕES ESPECÍFICAS POR MODELO
# ------------------------------------------------------------
model_config:
  resnext50_32x4d:
    type: "cnn"
    weights: "IMAGENET1K_V2"
    adaptation_layer: "conv1"
    classifier_layer: "fc"
    gradcam_target_layer: "layer4[-1]"
    unfreeze_strategy: "partial" # none, partial, full
    unfreeze_layers: ["layer4.2"]
    freeze_backbone: false

  convnext_tiny:
    type: "cnn"
    weights: "IMAGENET1K_V1"
    adaptation_layer: "features[0][0]"
    classifier_layer: "classifier"
    gradcam_target_layer: "stages[-1]"
    unfreeze_strategy: "partial"
    unfreeze_layers: ["features.7.2"] # Apenas o ÚLTIMO bloco do estágio final
    freeze_backbone: false

  efficientnetv2_s:
    type: "cnn"
    weights: "IMAGENET1K_V1"
    adaptation_layer: "features[0][0]"
    classifier_layer: "classifier"
    gradcam_target_layer: "features[-1]"
    unfreeze_strategy: "partial"
    unfreeze_layers: ["features\\.6\\.1[2-4]", "features\\.[78]"] # Final do Stage 6 + Stages 7 e 8 (Ratio ~18-20%)
    freeze_backbone: false

  densenet121:
    type: "cnn"
    weights: "IMAGENET1K_V1"
    adaptation_layer: "features.conv0"
    classifier_layer: "classifier"
    gradcam_target_layer: "features.denseblock4"
    unfreeze_strategy: "partial"
    unfreeze_layers: [
      "features.denseblock4.denselayer(9|1[0-6])", # Camadas 9 a 16
      "features.norm5"
    ]
    freeze_backbone: false

  vit_b_16:
    type: "transformer"
    timm_model: "vit_base_patch16_224"
    pretrained: true
    adaptation_layer: "patch_embed.proj"
    classifier_layer: "head"
    gradcam_target_layer: "blocks[-1].norm1"
    unfreeze_strategy: "partial"
    unfreeze_layers: ["blocks\\.11"] # Apenas o ÚLTIMO bloco (Ratio ~8.5%)
    freeze_patch_embed: true
    freeze_backbone: false 

  swin_v2_tiny:
    type: "transformer"
    timm_model: "swinv2_tiny_window8_256"
    pretrained: true
    adaptation_layer: "patch_embed.proj"
    classifier_layer: "head"
    gradcam_target_layer: "layers[-1].blocks[-1].norm1"
    unfreeze_strategy: "partial"
    unfreeze_layers: ["layers\\.3\\.blocks\\.1\\.mlp", "norm$"] # Apenas o MLP do último bloco (Ratio ~15-18%)
    freeze_patch_embed: true
    freeze_backbone: false

# ------------------------------------------------------------
# 4. CONFIGURAÇÕES DE FINE-TUNING
# ------------------------------------------------------------
fine_tuning:
  backbone_lr_ratio:
    cnn: 0.05     
    transformer: 0.02

# ------------------------------------------------------------
# 5. GRID DE HIPERPARÂMETROS PARA BUSCA ALEATÓRIA
# ------------------------------------------------------------
hyperparameter_grids:
  cnn:
    learning_rate: [1e-3, 5e-4, 2e-4, 1e-4, 5e-5]
    dropout: [0.3, 0.4, 0.5, 0.6, 0.7]
    hidden_units: [64, 128, 256, 512]
    optimizer: ["adamw"]
    batch_size: [16, 32]
    loss_function: ["crossentropy"]

  vit:
    learning_rate: [5e-5, 2e-5, 1e-5, 5e-6, 2e-6]
    dropout: [0.3, 0.4, 0.5, 0.6, 0.7]
    hidden_units: [128, 256, 512, 1024]
    optimizer: ["adamw"]
    batch_size: [8, 16]
    loss_function: ["crossentropy"]

  swin:
    learning_rate: [5e-5, 2e-5, 1e-5, 5e-6, 2e-6]
    dropout: [0.3, 0.4, 0.5, 0.6, 0.7]
    hidden_units: [128, 256, 512, 1024]
    optimizer: ["adamw"]
    batch_size: [8, 16]
    loss_function: ["crossentropy"]

# ------------------------------------------------------------
# 6. FUNÇÃO DE PERDA E OTIMIZADOR
# ------------------------------------------------------------
loss_config:
  crossentropy:
    use_class_weights: true
    label_smoothing:
      cnn: 0.15
      transformer: 0.15

optimizer_config:
  adamw:
    weight_decay:
      cnn: 0.1
      transformer: 0.1

# ------------------------------------------------------------
# 7. ESTRATÉGIA DE BUSCA (RANDOM SEARCH)
# ------------------------------------------------------------
search_strategy:
  max_combinations: 60
  validation_strategy: "kfold"
  n_folds: 5

# ------------------------------------------------------------
# 8. RESULTADOS E SAÍDA
# ------------------------------------------------------------
results:
  save_path: "../../shared/logs"
  save_checkpoints: true