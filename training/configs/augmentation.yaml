# Configurações de Data Augmentation

# Configurações por número de SUJEITOS (pacientes) únicos
dataset_size_thresholds:
  small: 200      # <200 sujeitos: augmentação pesada
  medium: 500     # <500 sujeitos: augmentação moderada
  large: 500      # ≥500 sujeitos: augmentação leve

# Augmentações para treino - Dataset Pequeno (<20k)
train_heavy_cnn:
  resize:
    enabled: true
    size: null  # Definido por MedicalImagePreprocessor

  horizontal_flip:
    enabled: true
    probability: 0.5

  rotation:
    enabled: true
    limit: 10
    probability: 0.5

  affine:
    enabled: true
    scale: [0.90, 1.10]
    translate_percent: [-0.08, 0.08]
    probability: 0.4

  clahe:
    enabled: true
    clip_limit: 2.0
    tile_grid_size: [8, 8]
    probability: 0.7

  brightness_contrast:
    enabled: true
    brightness_limit: 0.15
    contrast_limit: 0.20
    probability: 0.6

  random_gamma:
    enabled: true
    gamma_limit: [85, 115]
    probability: 0.5

  blur_sharpen:
    enabled: true
    gaussian_blur:
      blur_limit: [1, 3]
    sharpen:
      alpha: [0.1, 0.3]
      lightness: [0.7, 1.0]
    probability: 0.3

  gauss_noise:
    enabled: true
    std_range: [0.02, 0.08]
    mean_range: [0.0, 0.0]
    probability: 0.3

train_heavy_transformer:
  resize:
    enabled: true
    size: null  # Definido por MedicalImagePreprocessor

  horizontal_flip:
    enabled: true
    probability: 0.5

  rotation:
    enabled: true
    limit: 8
    probability: 0.4

  clahe:
    enabled: true
    clip_limit: 1.5
    tile_grid_size: [8, 8]
    probability: 0.5

  brightness_contrast:
    enabled: true
    brightness_limit: 0.12
    contrast_limit: 0.15
    probability: 0.5

  affine:
    enabled: true
    scale: [0.92, 1.08]
    translate_percent: [-0.06, 0.06]
    probability: 0.3

  random_gamma:
    enabled: true
    gamma_limit: [90, 110]
    probability: 0.4

  gauss_noise:
    enabled: true
    std_range: [0.02, 0.06]
    mean_range: [0.0, 0.0]
    probability: 0.25

