# Augmentações sintéticas para classes minoritárias - CNN
synthetic_cnn:

  affine:
    enabled: true
    translate_percent:
      x: [-0.05, 0.05]
      y: [-0.05, 0.05]
    scale: [0.9, 1.1]
    rotate: [-5, 5]
    probability: 0.6

  elastic_transform:
    enabled: true
    alpha: 1
    sigma: 20
    probability: 0.3

  random_tone_curve:
    enabled: true
    scale: 0.2
    probability: 0.5

  perspective:
    enabled: true
    scale: [0.05, 0.1]
    probability: 0.2

  gauss_noise:
    enabled: true
    std_range: [0.05, 0.15]
    mean_range: [0.0, 0.0]
    probability: 0.4

# Augmentações sintéticas para classes minoritárias - Transformer
synthetic_transformer:

  affine:
    enabled: true
    translate_percent:
      x: [-0.05, 0.05]
      y: [-0.05, 0.05]
    scale: [0.92, 1.08]
    rotate: [-5, 5]
    probability: 0.5

  elastic_transform:
    enabled: true
    alpha: 1
    sigma: 20
    probability: 0.3

  perspective:
    enabled: true
    scale: [0.05, 0.08]
    probability: 0.2

  grid_distortion:
    enabled: true
    num_steps: 5
    distort_limit: 0.3
    probability: 0.3

  random_tone_curve:
    enabled: true
    scale: 0.15
    probability: 0.4

  gauss_noise:
    enabled: true
    std_range: [0.05, 0.15]
    mean_range: [0.0, 0.0]
    probability: 0.4

# Configurações de augmentação de classes minoritárias
minority_augmentation:
  strategies:
    balance:
      description: "Iguala quantidade da classe minoritária com a majoritária"
    ratio:
      description: "Define proporção entre minoritária e majoritária"
      default_ratio: 0.6
    proportional:
      description: "Aumenta classe minoritária em 1.5x"
      multiplier: 1.5
    custom:
      description: "Define a contagem do número de amostras da(s) classe(s) minoritária(s)"
      targets:
        0: 6000
        1: 4000
    percentage:
      description: "Define uma porcentagem do dataset para a quantidade de amostras da(s) classe(s) minoritária(s)"
      targets:
        0: 0.40

  random_seed:
    base: 42
    per_class_offset: true  # Adiciona class_id ao seed base