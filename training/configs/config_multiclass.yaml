# ============================================================
# CONFIGURAÇÕES PARA MODELO MULTICLASSE (NÍVEIS DE DEMÊNCIA)
# ============================================================

# ------------------------------------------------------------
# 1. CONFIGURAÇÕES DO MODELO
# ------------------------------------------------------------
model:
  name: "multiclass_classifier"
  num_classes: 2
  class_names: ["Very mild Dementia", "Mild+Moderate Dementia"]
  class_mapping:
    "Very mild Dementia": 0
    "Mild Dementia": 1
    "Moderate Dementia": 1
  merge_classes:
    "Mild+Moderate Dementia": ["Mild Dementia", "Moderate Dementia"]
  filter_non_demented: true

# ------------------------------------------------------------
# 2. CONFIGURAÇÕES DE DADOS E DATASET
# ------------------------------------------------------------
data:
  dataset_type: "multiclass"
  data_path: "../shared/data/splits/multiclass"
  split_ratios:
    train: 0.8
    train_val: 0.2
    test: 0.2
  stratify: true
  random_seed: 42
  max_slices_per_subject: 120
  minority_classes: [0]
  
  minority_augmentation:
    enabled: true
    strategy: "ratio" 
    ratio: { default_ratio: 0.7 }
    proportional: { multiplier: 1.5 }

# ------------------------------------------------------------
# 3. PARÂMETROS DE TREINAMENTO
# ------------------------------------------------------------
training:
  epochs: 150
  patience: 25
  scheduler:
    type: "reduce_on_plateau"
    params: { mode: "max", factor: 0.5, patience: 8, min_lr: 1e-6 }

# ------------------------------------------------------------
# 4. MÉTRICAS E VALIDAÇÃO
# ------------------------------------------------------------
validation:
  metrics: ["accuracy", "precision", "recall", "f1_score", "confusion_matrix", "roc_auc"]

# ------------------------------------------------------------
# 5. SALVAMENTO E LOGS
# ------------------------------------------------------------
checkpoint:
  save_path: "../../shared/models/multiclass"
  monitor: "val_f1_score"

logging:
  wandb:
    enabled: false
    project: "alzheimer-multiclass"
    entity: "samuel89-ufc-ai"
    run_name: null