# Configurações para Modelo Multiclasse: Níveis de Demência

model:
  name: "multiclass_classifier"
  num_classes: 2
  class_names:
    - "Mild+Moderate Dementia"
    - "Very mild Dementia"

  # Mapeamento de classes do dataset original para as classes unificadas
  class_mapping:
    "Mild Dementia": 0       # Mild Dementia -> classe 0 (Mild+Moderate)
    "Moderate Dementia": 0   # Moderate Dementia -> classe 0 (Mild+Moderate)
    "Very mild Dementia": 1  # Very mild Dementia -> classe 1

  # Configuração de merge de classes
  merge_classes:
    "Mild+Moderate Dementia":
      - "Mild Dementia"
      - "Moderate Dementia"

  # Filtrar apenas imagens com demência
  filter_non_demented: true

data:
  dataset_type: "multiclass"
  data_path: "../shared/data/splits/multiclass"
  split_ratios:
    train: 0.8
    train_val: 0.2
    test: 0.2
  stratify: true
  random_seed: 42
  max_slices_per_subject: 45

  # Classes minoritárias para augmentação
  minority_classes: [0]  # Mild+Moderate é minoritária

  # Estratégia de balanceamento
  minority_augmentation:
    enabled: true
    strategy: "ratio"
    ratio:
      default_ratio: 0.7
    proportional:
      multiplier: 1.5
    custom:
      targets:
        0: 8000  # Mild+Moderate: número absoluto de amostras
    percentage:
      targets:
        0: 0.40  # Mild+Moderate: 40% do dataset final

training:
  epochs: 150
  patience: 25  # Early stopping

  # Scheduler - Reduce on Plateau
  scheduler:
    type: "reduce_on_plateau"
    params:
      factor: 0.2
      patience: 5
      min_lr: 1e-7

validation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "confusion_matrix"
    - "roc_auc"

checkpoint:
  save_path: "../../shared/models/multiclass"
  monitor: "val_f1_score"

logging:
  wandb:
    enabled: true
    project: "alzheimer-multiclass"
    entity: "samuel89-ufc-ai"
    run_name: null  # Auto-gerado se null