# ============================================================
# CONFIGURAÇÕES PARA MODELO BINÁRIO (NON DEMENTED vs DEMENTED)
# ============================================================

# ------------------------------------------------------------
# 1. CONFIGURAÇÕES DO MODELO
# ------------------------------------------------------------
model:
  name: "binary_classifier"
  num_classes: 2
  class_names: ["Demented", "Non Demented"]
  class_mapping:
    "Non Demented": 1
    "Very mild Dementia": 0
    "Mild Dementia": 0
    "Moderate Dementia": 0

# ------------------------------------------------------------
# 2. CONFIGURAÇÕES DE DADOS E DATASET
# ------------------------------------------------------------
data:
  dataset_type: "binary"
  data_path: "../shared/data/splits/binary"
  split_ratios:
    train: 0.8
    train_val: 0.2
    test: 0.2
  stratify: true
  random_seed: 42
  max_slices_per_subject: 80
  minority_classes: [0]
  
  minority_augmentation:
    enabled: true
    strategy: "ratio"
    ratio: { default_ratio: 0.6 }
    proportional: { multiplier: 1.5 }

# ------------------------------------------------------------
# 3. PARÂMETROS DE TREINAMENTO
# ------------------------------------------------------------
training:
  epochs: 150
  patience: 25
  scheduler:
    type: "reduce_on_plateau"
    params: { factor: 0.2, patience: 5, min_lr: 1e-7 }

# ------------------------------------------------------------
# 4. MÉTRICAS E VALIDAÇÃO
# ------------------------------------------------------------
validation:
  metrics: ["accuracy", "precision", "recall", "f1_score", "confusion_matrix", "roc_auc"]

# ------------------------------------------------------------
# 5. SALVAMENTO E LOGS
# ------------------------------------------------------------
checkpoint:
  save_path: "../../shared/models/binary"
  monitor: "val_f1_score"

logging:
  wandb:
    enabled: true
    project: "alzheimer-binary"
    entity: "samuel89-ufc-ai"
    run_name: null
